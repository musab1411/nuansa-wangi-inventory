# Prometheus scrape config - Nuansa Wangi
#
# Jalankan Prometheus di host yang sama dengan API:
#   docker run --rm -p 9090:9090 -v %cd%/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus
#
# Kalau API berjalan sebagai container di network jmk48-net, ganti target
# menjadi "api:8000" dan jalankan Prometheus di network yang sama:
#   docker run --rm --network jmk48-net -p 9090:9090 \
#     -v ${PWD}/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml prom/prometheus

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: nuansa-wangi-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8000"
        labels:
          app: nuansa-wangi
          environment: local
